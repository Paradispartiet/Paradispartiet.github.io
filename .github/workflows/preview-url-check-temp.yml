name: Preview URL check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify preview URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://paradispartiet.github.io/HG_Film_Producer-preview/ \
            https://paradispartiet.github.io/HistoryGo-FootballManager-preview/ \
            https://paradispartiet.github.io/History-Go-preview/; do
            ok=false
            for i in $(seq 1 60); do
              code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$url" || true)"
              echo "$code $url"
              case "$code" in 2*) ok=true; break;; esac
              sleep 5
            done
            test "$ok" = true
          done
          echo PREVIEWS_LIVE_OK
