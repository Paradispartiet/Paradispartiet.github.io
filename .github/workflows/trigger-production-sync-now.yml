name: Trigger production sync now

# One-shot retry after cleanup.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-production-sync-now.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-production-sites.yml --ref main
