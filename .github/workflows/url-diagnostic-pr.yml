name: URL diagnostic PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed application URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://paradispartiet.github.io/ \
            https://paradispartiet.github.io/HG_Film_Producer/ \
            https://paradispartiet.github.io/HistoryGo-FootballManager/; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$url" || true)"
            echo "$code $url"
          done
