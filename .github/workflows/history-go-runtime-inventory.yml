name: History Go runtime inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and build History Go
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Paradispartiet/History-Go.git history-go
          cd history-go
          npm ci
          npm run build:web
      - name: Print top-level inventory
        shell: bash
        run: |
          set -euo pipefail
          cd history-go
          echo '=== TOP LEVEL ==='
          find . -mindepth 1 -maxdepth 1 -printf '%f\t%y\n' | sort
          echo '=== ROOT WEB FILES ==='
          find . -mindepth 1 -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.svg' -o -name '*.png' -o -name '*.ico' \) -printf '%f\n' | sort
          echo '=== TOP LEVEL DIRECTORY SIZES ==='
          du -sh -- * 2>/dev/null | sort -h | tail -n 60
      - name: Extract referenced top-level runtime paths
        shell: bash
        run: |
          set -euo pipefail
          cd history-go
          python - <<'PY'
          import pathlib, re
          roots=set()
          for p in pathlib.Path('.').glob('*.html'):
              text=p.read_text('utf-8', errors='ignore')
              for value in re.findall(r'''(?:src|href)=["']([^"'#?]+)''', text, flags=re.I):
                  value=value.strip()
                  if not value or value.startswith(('http://','https://','data:','mailto:','tel:','//','/')):
                      continue
                  value=value.lstrip('./')
                  if value:
                      roots.add(value.split('/')[0])
          print('=== HTML REFERENCED TOP-LEVEL PATHS ===')
          for item in sorted(roots): print(item)
          PY
