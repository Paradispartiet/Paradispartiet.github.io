name: Verify public app surface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-surface.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify published URLs
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://paradispartiet.github.io/'
            'https://paradispartiet.github.io/HG_Film_Producer/'
            'https://paradispartiet.github.io/HistoryGo-FootballManager/'
          )
          for url in "${urls[@]}"; do
            ok=false
            for i in $(seq 1 60); do
              if curl --location --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
                ok=true
                break
              fi
              sleep 5
            done
            test "$ok" = "true"
            echo "OK $url"
          done
      - name: Record verified deploy surface
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"verified":true,"filmProducer":true,"footballManager":true}' > DEPLOY_OK.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_OK.json
          git commit -m "verify: public deploy surface is live"
          git push origin HEAD:main
