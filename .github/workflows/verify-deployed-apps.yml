name: Diagnose deployed app URLs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-deployed-apps.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public application URLs
        shell: bash
        run: |
          set -euo pipefail
          film_url='https://paradispartiet.github.io/HG_Film_Producer/'
          football_url='https://paradispartiet.github.io/HistoryGo-FootballManager/'
          film_code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$film_url" || true)"
          football_code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$football_url" || true)"
          printf 'film=%s\nfootball=%s\n' "$film_code" "$football_code" > LIVE_STATUS.txt
          cat LIVE_STATUS.txt
      - name: Record diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_STATUS.txt
          git commit -m "diagnose: record deployed app HTTP status"
          git push origin HEAD:main
