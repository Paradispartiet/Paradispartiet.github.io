name: Verify deployed apps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-deployed-apps.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public application URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://paradispartiet.github.io/HG_Film_Producer/ \
            https://paradispartiet.github.io/HistoryGo-FootballManager/; do
            ok=false
            for i in $(seq 1 30); do
              if curl --location --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
                ok=true
                break
              fi
              sleep 5
            done
            test "$ok" = true
            echo "OK $url"
          done
      - name: Record verification
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"verified":true,"filmProducer":true,"footballManager":true}' > LIVE_OK.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_OK.json
          git commit -m "verify: deployed apps are live"
          git push origin HEAD:main
