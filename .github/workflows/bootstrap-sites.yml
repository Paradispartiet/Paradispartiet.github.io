name: Bootstrap public app artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-sites.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Film Producer public artifact
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/HG_Film_Producer"
          git clone --depth 1 https://github.com/Paradispartiet/HG_Film_Producer.git "$src"
          cd "$src"
          npm ci
          npm run verify:v0.1
          test -f dist/index.html
          rm -rf "$GITHUB_WORKSPACE/HG_Film_Producer"
          mkdir -p "$GITHUB_WORKSPACE/HG_Film_Producer"
          cp -a dist/. "$GITHUB_WORKSPACE/HG_Film_Producer/"
          find "$GITHUB_WORKSPACE/HG_Film_Producer" -type f -name '*.map' -delete

      - name: Build Football Manager public artifact
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/HistoryGo-FootballManager"
          git clone --depth 1 https://github.com/Paradispartiet/HistoryGo-FootballManager.git "$src"
          cd "$src"
          npm ci
          npm run typecheck
          npm run build
          npm run stage:pages
          npm run audit:pages-artifact
          test -f _site/index.html
          rm -rf "$GITHUB_WORKSPACE/HistoryGo-FootballManager"
          mkdir -p "$GITHUB_WORKSPACE/HistoryGo-FootballManager"
          cp -a _site/. "$GITHUB_WORKSPACE/HistoryGo-FootballManager/"
          find "$GITHUB_WORKSPACE/HistoryGo-FootballManager" -type f -name '*.map' -delete

      - name: Verify deploy-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f HG_Film_Producer/index.html
          test -f HistoryGo-FootballManager/index.html
          for path in \
            HG_Film_Producer/CLAUDE.md \
            HG_Film_Producer/AGENTS.md \
            HistoryGo-FootballManager/CLAUDE.md \
            HistoryGo-FootballManager/AGENTS.md; do
            test ! -e "$path"
          done

      - name: Commit generated public artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HG_Film_Producer HistoryGo-FootballManager
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "deploy: bootstrap Film Producer and Football Manager"
          git push origin HEAD:main
