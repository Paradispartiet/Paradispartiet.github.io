name: Bootstrap History Go deploy artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-history-go.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout deploy repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone and build History Go
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/History-Go"
          git clone --depth 1 https://github.com/Paradispartiet/History-Go.git "$src"
          cd "$src"
          npm ci
          npm run build:web

      - name: Stage deploy-only runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/History-Go"
          out="$GITHUB_WORKSPACE/History-Go"
          rm -rf "$out"
          mkdir -p "$out"

          root_files=(
            Civication.html
            emner.html
            fagverk-forside.html
            fagverk-sted.html
            fagverk.html
            index.html
            knowledge-profile.html
            knowledge.html
            knowledge.js
            knowledge_by.html
            manifest.json
            merke.html
            notater.html
            profile.html
            sw.js
          )
          for file in "${root_files[@]}"; do
            test -f "$src/$file"
            cp "$src/$file" "$out/$file"
          done

          runtime_dirs=(assets bilder css data dist games js knowledge merker subpages)
          for dir in "${runtime_dirs[@]}"; do
            if [ -d "$src/$dir" ]; then
              mkdir -p "$out/$dir"
              cp -a "$src/$dir/." "$out/$dir/"
            fi
          done

          find "$out" -type f \( \
            -name '*.ts' -o \
            -name '*.tsx' -o \
            -name '*.map' -o \
            -name '*.md' -o \
            -name '*.markdown' -o \
            -name '*.mjs' -o \
            -name '*.cjs' -o \
            -name '*.py' -o \
            -name '*.sh' \
          \) -delete
          find "$out" -type d \( \
            -name '__tests__' -o \
            -name 'tests' -o \
            -name 'test' \
          \) -prune -exec rm -rf {} +

          touch "$out/.nojekyll"

      - name: Enforce deploy boundary
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/History-Go"
          test -f "$out/index.html"
          test -f "$out/sw.js"
          test -f "$out/data/places/places_index.json"
          test -d "$out/bilder"
          test -d "$out/js"
          test -d "$out/css"
          test -d "$out/dist/web"

          forbidden=(
            AGENTS.md CLAUDE.md DOCS.md README.md TYPESCRIPT_MIGRATION.md
            package.json package-lock.json render.yaml
            backend build docs reports schemas scripts supabase tests tools AHA BACKLOG README .github .devcontainer
          )
          for path in "${forbidden[@]}"; do
            test ! -e "$out/$path"
          done
          if find "$out" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name '*.md' \) | grep -q .; then
            echo 'Forbidden source/editorial files remain in deploy artifact.' >&2
            exit 1
          fi

      - name: Verify service-worker precache contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          out = pathlib.Path('History-Go')
          sw = (out / 'sw.js').read_text('utf-8')
          m = re.search(r'const\s+PRECACHE_URLS\s*=\s*\[(.*?)\];', sw, re.S)
          if not m:
              raise SystemExit('PRECACHE_URLS not found')
          values = re.findall(r'["\']([^"\']+)["\']', m.group(1))
          missing = []
          for value in values:
              if value in ('./', '/') or value.startswith(('http://','https://','data:','//')):
                  continue
              rel = value[2:] if value.startswith('./') else value
              if not (out / rel).exists():
                  missing.append(rel)
          if missing:
              print('Missing precache runtime files:', *missing, sep='\n  ', file=sys.stderr)
              raise SystemExit(1)
          print(f'Precache verified: {len(values)} entries')
          PY

      - name: Local HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory "$GITHUB_WORKSPACE" >/tmp/history-go-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          for path in \
            History-Go/ \
            History-Go/index.html \
            History-Go/profile.html \
            History-Go/Civication.html \
            History-Go/fagverk.html \
            History-Go/data/places/places_index.json; do
            curl --fail --silent --show-error --max-time 20 "http://127.0.0.1:8765/$path" >/dev/null
          done

      - name: Commit generated runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add History-Go
          if git diff --cached --quiet; then
            echo 'No History Go artifact changes to commit.'
            exit 0
          fi
          git commit -m 'deploy: bootstrap History Go runtime'
          git push origin HEAD:main
