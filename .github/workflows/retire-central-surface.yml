name: Retire obsolete central surface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-central-surface.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: retire-central-surface
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      configure_outcome: ${{ steps.configure.outcome }}
    steps:
      - name: Build inactive page
        shell: bash
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ikke i bruk</title></head><body><main><h1>Denne midlertidige deployflaten er ikke lenger i bruk.</h1><p>Prosjektene publiseres igjen direkte fra sine egne repositories.</p></main></body></html>
          EOF
          touch _site/.nojekyll
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Record configure outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.configure.outcome }}
        run: |
          set -euo pipefail
          printf 'configure=%s\nrun_id=%s\n' "$OUTCOME" "$GITHUB_RUN_ID" > /tmp/status
          encoded="$(base64 -w0 /tmp/status)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.central-retire-diagnostic.txt?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/.central-retire-diagnostic.txt" -f message="Record central retire diagnostic ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main)
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
      - name: Require Pages configuration
        if: steps.configure.outcome != 'success'
        run: exit 1
      - name: Upload retired site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy retired site
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify retired page and record success
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}?retire=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null || true)"
            if grep -Fq 'Denne midlertidige deployflaten er ikke lenger i bruk.' <<<"$body"; then
              printf 'retired=success\nrun_id=%s\nsource_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > /tmp/retired
              encoded="$(base64 -w0 /tmp/retired)"
              current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.retired-pages.txt?ref=main" --jq .sha 2>/dev/null || true)"
              args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/.retired-pages.txt" -f message="Record retired central surface ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main)
              if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
              gh api "${args[@]}" >/dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1
