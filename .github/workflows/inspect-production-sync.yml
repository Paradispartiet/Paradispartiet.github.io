name: Inspect production sync

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/inspect-production-sync.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show recent production sync runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'Recent sync runs:'
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-production-sites.yml/runs?per_page=10" \
            --jq '.workflow_runs[] | [.id,.status,.conclusion,.event,.head_sha,.created_at] | @tsv'
