<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1414">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0;url=https://fysen.vercel.app/">
  <link rel="canonical" href="https://fysen.vercel.app/">
  <title>Fysen – åpner appen</title>
  <style>
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:#0b1414;color:#f7f8f1;font:18px/1.5 system-ui,sans-serif}
    main{padding:32px;text-align:center}a{color:#d9f29f;font-weight:700}
  </style>
</head>
<body>
  <main>
    <p>Åpner Fysen …</p>
    <p><a href="https://fysen.vercel.app/">Åpne Fysen</a></p>
  </main>
  <script>
    (() => {
      const destination = new URL("https://fysen.vercel.app/");
      const current = new URL(window.location.href);
      const query = current.searchParams.get("q");
      if (query && query.trim()) {
        destination.pathname = "/search";
        destination.searchParams.set("q", query);
      }
      if (current.hash) destination.hash = current.hash;
      window.location.replace(destination.href);
    })();
  </script>
</body>
</html>
