<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HG Football Manager">
  <!-- Based on the HG/FM welcome crest and its established green palette. -->
  <rect width="64" height="64" rx="12" fill="#112b23"/>
  <rect x="7" y="12" width="50" height="40" rx="9" fill="#247b57" fill-opacity=".28" stroke="#7de4af" stroke-opacity=".6"/>
  <text x="12" y="39" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900" letter-spacing="-2" fill="#e5ffee">HG</text>
  <text x="40" y="39" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900" fill="#72e5a2">FM</text>
</svg>
